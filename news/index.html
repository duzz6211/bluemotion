<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="블루모션 공지/뉴스 - 최신 소식과 공지사항">
    <meta name="keywords" content="블루모션 뉴스, 공지사항, FMTA 소식">
    <meta property="og:site_name" content="BLUEMOTION">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="공지/뉴스 - 블루모션">
    <meta property="og:description" content="블루모션 공지/뉴스 - 최신 소식과 공지사항">
    <meta property="og:type" content="website">
    <title>공지/뉴스 - 블루모션</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation Component -->
    <div id="nav-container"></div>

    <nav class="sub-nav">
        <div class="container">
            <a href="./index.html" class="sub-nav-link active">공지/뉴스</a>
            <a href="./sns.html" class="sub-nav-link">SNS</a>
            <a href="./contact.html" class="sub-nav-link">문의</a>
        </div>
    </nav>

    <section class="hero hero-sm">
        <div class="container">
            <div class="breadcrumb">
                <a href="../index.html">홈</a><span>›</span>
                <span>공지/뉴스</span>
            </div>
            <h1 class="hero-title">공지/뉴스</h1>
            <p class="hero-subtitle">블루모션의 새로운 소식</p>
        </div>
    </section>

    <main>
        <section class="section">
            <div class="container">
                <div class="content-with-sidebar">
                    <div class="main-content">
                        <!-- News List -->
                        <div class="mb-5">
                            <h2 class="section-title mb-3">전체 소식</h2>
                            
                            <!-- 뉴스 테이블 (JavaScript로 동적 렌더링) -->
                            <div class="table-wrapper">
                                <table class="table" id="news-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 10%;">번호</th>
                                            <th style="width: 15%;">분류</th>
                                            <th style="width: 50%;">제목</th>
                                            <th style="width: 25%;">날짜</th>
                                        </tr>
                                    </thead>
                                    <tbody id="news-list">
                                        <!-- JavaScript로 동적 생성 -->
                                        <tr>
                                            <td colspan="4" class="text-center" style="padding: 2rem;">로딩 중...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <!-- Pagination (JavaScript로 동적 렌더링) -->
                            <div class="pagination" id="news-pagination">
                                <!-- JavaScript로 동적 생성 -->
                            </div>
                        </div>
                    </div>

                    <aside class="sidebar">
                        <div class="sidebar-menu">
                            <h4 class="sidebar-title">공지/뉴스</h4>
                            <a href="./index.html" class="sidebar-link active">공지/뉴스</a>
                            <a href="./sns.html" class="sidebar-link">SNS</a>
                            <a href="./contact.html" class="sidebar-link">문의</a>
                        </div>
                        
                        <div class="info-box mt-4">
                            <h4 class="info-box-title">빠른 문의</h4>
                            <p style="font-size: var(--font-size-md); margin-bottom: 1rem;">
                                Tel. 054-XXX-XXXX<br>
                                Email. info@bluemotion.co.kr
                            </p>
                            <a href="./contact.html" class="btn btn-primary btn-sm" style="width: 100%;">
                                문의하기
                            </a>
                        </div>
                    </aside>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Component -->
    <div id="footer-container"></div>

    <script src="../js/main.js"></script>
    <script>
        // 뉴스 페이지네이션 시스템
        (function() {
            const NEWS_PER_PAGE = 10;
            let newsData = [];
            let currentPage = 1;
            let totalPages = 1;

            // 뉴스 데이터 로드
            async function loadNewsData() {
                try {
                    const response = await fetch('./news.json');
                    if (!response.ok) throw new Error('Failed to load news data');
                    newsData = await response.json();
                    // 이미 역순(50번부터)으로 정렬되어 있음
                    totalPages = Math.ceil(newsData.length / NEWS_PER_PAGE);
                    renderNews();
                    renderPagination();
                } catch (error) {
                    console.error('뉴스 데이터 로드 실패:', error);
                    document.getElementById('news-list').innerHTML = 
                        '<tr><td colspan="4" class="text-center" style="padding: 2rem; color: var(--color-gray-500);">데이터를 불러올 수 없습니다.</td></tr>';
                }
            }

            // 뉴스 목록 렌더링
            function renderNews() {
                const startIndex = (currentPage - 1) * NEWS_PER_PAGE;
                const endIndex = startIndex + NEWS_PER_PAGE;
                const pageNews = newsData.slice(startIndex, endIndex);
                
                const newsList = document.getElementById('news-list');
                
                if (pageNews.length === 0) {
                    newsList.innerHTML = '<tr><td colspan="4" class="text-center" style="padding: 2rem;">등록된 소식이 없습니다.</td></tr>';
                    return;
                }
                
                newsList.innerHTML = pageNews.map(news => `
                    <tr>
                        <td class="text-center">${news.id}</td>
                        <td><span class="news-category news-category-${getCategoryClass(news.category)}">[${news.category}]</span></td>
                        <td>
                            <a href="#" class="news-title-link" data-id="${news.id}">
                                ${news.title}
                            </a>
                            <p class="news-summary">${news.summary}</p>
                        </td>
                        <td class="text-muted">${news.date}</td>
                    </tr>
                `).join('');
                
                // 부드러운 스크롤 효과
                const newsTable = document.getElementById('news-table');
                newsTable.style.opacity = '0';
                newsTable.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    newsTable.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    newsTable.style.opacity = '1';
                    newsTable.style.transform = 'translateY(0)';
                }, 50);
            }

            // 카테고리 클래스 반환
            function getCategoryClass(category) {
                const classes = {
                    '공지': 'notice',
                    '교육': 'education',
                    '프로그램': 'program',
                    '이벤트': 'event',
                    '제휴': 'partner'
                };
                return classes[category] || 'default';
            }

            // 페이지네이션 렌더링
            function renderPagination() {
                const pagination = document.getElementById('news-pagination');
                let html = '';
                
                // 이전 버튼
                html += `<button class="pagination-btn ${currentPage === 1 ? 'disabled' : ''}" 
                         onclick="goToPage(${currentPage - 1})" 
                         ${currentPage === 1 ? 'disabled' : ''}>&lt;</button>`;
                
                // 페이지 번호들
                const maxVisiblePages = 5;
                let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
                let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
                
                if (endPage - startPage + 1 < maxVisiblePages) {
                    startPage = Math.max(1, endPage - maxVisiblePages + 1);
                }
                
                if (startPage > 1) {
                    html += `<button class="pagination-btn" onclick="goToPage(1)">1</button>`;
                    if (startPage > 2) {
                        html += `<span class="pagination-ellipsis">...</span>`;
                    }
                }
                
                for (let i = startPage; i <= endPage; i++) {
                    html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" 
                             onclick="goToPage(${i})">${i}</button>`;
                }
                
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        html += `<span class="pagination-ellipsis">...</span>`;
                    }
                    html += `<button class="pagination-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
                }
                
                // 다음 버튼
                html += `<button class="pagination-btn ${currentPage === totalPages ? 'disabled' : ''}" 
                         onclick="goToPage(${currentPage + 1})" 
                         ${currentPage === totalPages ? 'disabled' : ''}>&gt;</button>`;
                
                pagination.innerHTML = html;
            }

            // 페이지 이동 (전역 함수로 노출)
            window.goToPage = function(page) {
                if (page < 1 || page > totalPages || page === currentPage) return;
                currentPage = page;
                renderNews();
                renderPagination();
                
                // 스크롤을 테이블 상단으로 (부드럽게)
                document.getElementById('news-table').scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            };

            // 페이지 로드 시 실행
            document.addEventListener('DOMContentLoaded', loadNewsData);
        })();
    </script>
    <style>
        /* 뉴스 테이블 추가 스타일 */
        .news-title-link {
            color: var(--color-gray-800);
            font-weight: 500;
            transition: color var(--transition-fast);
        }
        
        .news-title-link:hover {
            color: var(--color-primary);
        }
        
        .news-summary {
            font-size: var(--font-size-sm);
            color: var(--color-gray-500);
            margin: 0.25rem 0 0;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .news-category {
            font-size: var(--font-size-sm);
            font-weight: 500;
        }
        
        .news-category-notice { color: var(--color-primary); }
        .news-category-education { color: #7c3aed; }
        .news-category-program { color: var(--color-floating); }
        .news-category-event { color: #ea580c; }
        .news-category-partner { color: #16a34a; }
        .news-category-default { color: var(--color-gray-600); }
        
        #news-table {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 모바일 테이블 반응형 */
        @media (max-width: 480px) {
            .news-summary {
                font-size: 0.75em;
            }
            
            .news-category {
                font-size: 0.6875em;
            }
            
            #news-table th:nth-child(1),
            #news-table td:nth-child(1) {
                width: 12%;
            }
            
            #news-table th:nth-child(2),
            #news-table td:nth-child(2) {
                width: 18%;
            }
            
            #news-table th:nth-child(4),
            #news-table td:nth-child(4) {
                width: 22%;
            }
        }
    </style>
</body>
</html>
